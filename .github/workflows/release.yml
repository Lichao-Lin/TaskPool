name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaskPool app.py
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/TaskPool.exe, README.md, LICENSE -DestinationPath TaskPool-windows-x64.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TaskPool-windows-x64.zip
          generate_release_notes: true
